module: A
requires:
- I
capabilities:
  reservation_widths: [32, 64]
  subword_cmpxchg: unsupported
lowering:
  cmpxchg:
    32:
      pseudo: PseudoCMPXCHG32
      load_reserved: [LOAD_i32_res, LOAD_i32_res_aq]
      store_conditional: [CONDSTORE_32, CONDSTORE_32_rl]
    64:
      pseudo: PseudoCMPXCHG64
      load_reserved: [LOAD_i64_res, LOAD_i64_res_aq]
      store_conditional: [CONDSTORE_64, CONDSTORE_64_rl]
groups:
  a_instructions:
    LOAD_i32_res:
      opcode: AMO
      format: R
      mnemonic: LOAD.i32.res
      funct3: 2
      funct5: 2
      aq_bit26: 0
      rl_bit25: 0
      rs2_fixed: 0
      selection:
        kind: custom
        handler: LowerAtomic
    LOAD_i32_res_aq:
      opcode: AMO
      format: R
      mnemonic: LOAD.i32.res.aq
      funct3: 2
      funct5: 2
      aq_bit26: 1
      rl_bit25: 0
      rs2_fixed: 0
      selection:
        kind: custom
        handler: LowerAtomic
    LOAD_i64_res:
      opcode: AMO
      format: R
      mnemonic: LOAD.i64.res
      funct3: 3
      funct5: 2
      aq_bit26: 0
      rl_bit25: 0
      rs2_fixed: 0
      selection:
        kind: custom
        handler: LowerAtomic
    LOAD_i64_res_aq:
      opcode: AMO
      format: R
      mnemonic: LOAD.i64.res.aq
      funct3: 3
      funct5: 2
      aq_bit26: 1
      rl_bit25: 0
      rs2_fixed: 0
      selection:
        kind: custom
        handler: LowerAtomic
    CONDSTORE_8:
      opcode: AMO
      format: R
      mnemonic: CONDSTORE.8
      funct3: 0
      funct5: 3
      rl_bit25: 0
      selection:
        kind: custom
        handler: LowerAtomic
    CONDSTORE_16:
      opcode: AMO
      format: R
      mnemonic: CONDSTORE.16
      funct3: 1
      funct5: 3
      rl_bit25: 0
      selection:
        kind: custom
        handler: LowerAtomic
    CONDSTORE_32:
      opcode: AMO
      format: R
      mnemonic: CONDSTORE.32
      funct3: 2
      funct5: 3
      rl_bit25: 0
      selection:
        kind: custom
        handler: LowerAtomic
    CONDSTORE_64:
      opcode: AMO
      format: R
      mnemonic: CONDSTORE.64
      funct3: 3
      funct5: 3
      rl_bit25: 0
      selection:
        kind: custom
        handler: LowerAtomic
    CONDSTORE_8_rl:
      opcode: AMO
      format: R
      mnemonic: CONDSTORE.8.rl
      funct3: 0
      funct5: 3
      rl_bit25: 1
      selection:
        kind: custom
        handler: LowerAtomic
    CONDSTORE_16_rl:
      opcode: AMO
      format: R
      mnemonic: CONDSTORE.16.rl
      funct3: 1
      funct5: 3
      rl_bit25: 1
      selection:
        kind: custom
        handler: LowerAtomic
    CONDSTORE_32_rl:
      opcode: AMO
      format: R
      mnemonic: CONDSTORE.32.rl
      funct3: 2
      funct5: 3
      rl_bit25: 1
      selection:
        kind: custom
        handler: LowerAtomic
    CONDSTORE_64_rl:
      opcode: AMO
      format: R
      mnemonic: CONDSTORE.64.rl
      funct3: 3
      funct5: 3
      rl_bit25: 1
      selection:
        kind: custom
        handler: LowerAtomic
semantics: {}
