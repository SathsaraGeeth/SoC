register_file:
  name: unified
  width: 64
  count: 32
  names: { pattern: "R{index}", first: 0, last: 31 }
  fixed: { zero: R0, return_address: R1, stack_pointer: R2, frame_pointer: R8 }
  value_types: [i64, i32, f32]
  allocation_order: [R10, R11, R12, R13, R14, R15, R16, R17,
                     R5, R6, R7, R28, R29, R30, R31,
                     R8, R9, R18, R19, R20, R21, R22, R23,
                     R24, R25, R26, R27, R1, R3, R4, R2, R0]
