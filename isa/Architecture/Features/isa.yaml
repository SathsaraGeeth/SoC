features:
  processors:
    generic:
      itinerary: none
      enabled: [I, M, A, System, F]
  definitions:
    I:
      option: i
      field: HasI
      description: Base integer instruction set
    M:
      option: m
      field: HasM
      description: Integer multiply and divide instructions
      requires: [I]
    A:
      option: a
      field: HasA
      description: Atomic instructions
      requires: [I]
    System:
      option: system
      field: HasSystem
      description: System, CSR, and fence instructions
      requires: [I]
    F:
      option: f
      field: HasF
      description: Unified-register single-precision floating-point instructions
      requires: [I]
