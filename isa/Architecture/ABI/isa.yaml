abi:
  name: DMCTP64-draft
  arguments: [R10, R11, R12, R13, R14, R15, R16, R17]
  returns: [R10, R11]
  link_register: R1
  thread_pointer: R4
  callee_saved: [R1, R8, R9, R18, R19, R20, R21, R22, R23, R24, R25, R26, R27]
  reserved: [R0, R2, R4, R8]
  stack:
    slot_size: 8
    alignment: 16
    arguments_grow: up
  varargs:
    save_unused_argument_registers: true
    slot_size: 8
  floating:
    register_file: unified
    hardware_types: [f32]
    fixed_arguments:
      registers: shared_positional
      f32_bits: low_32
      upper_bits: unspecified
    returns:
      registers: shared_positional
      f32_bits: low_32
      upper_bits: unspecified
    stack:
      slot_size: 8
      f32_alignment: 4
      f32_bits: low_32
      padding_bits: unspecified
    f64:
      implementation: software
      transport: i64_bit_pattern
      slot_size: 8
      alignment: 8
    varargs:
      default_argument_promotion: f32_to_f64
      f64_transport: i64_bit_pattern
    aggregates:
      classification: flatten_in_source_order
      maximum_direct_fields: 2
      register_sequence: shared_positional
