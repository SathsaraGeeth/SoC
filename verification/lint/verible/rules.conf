# Verible lint rules configuration
# Lines starting with '+' enable a rule, '-' disable it
# This file is used with --rules_config or placed as .rules.verible_lint

# Formatting and style
+always-comb
+always-ff-non-blocking
+case-missing-default
+explicit-parameter-storage-type
+no-tabs
+no-trailing-spaces
+line-length=length:120
+posix-eof
+forbid-consecutive-null-statements
+forbid-defparam
+forbid-line-continuations
+suggest-parentheses
+truncated-numeric-literal
+undersized-binary-literal
+void-cast

# Naming conventions
+parameter-name-style
+signal-name-style
+macro-name-style
+interface-name-style
+enum-name-style
+module-filename
+package-filename
+generate-label
+generate-label-prefix

# Module structure
+module-begin-block
+module-parameter
+module-port
+one-module-per-file
+packed-dimensions-range-ordering
+unpacked-dimensions-range-ordering

# Declarations
+explicit-function-lifetime
+explicit-function-task-parameter-type
+explicit-task-lifetime
+typedef-enums
+typedef-structs-unions

# Disabled rules (too strict for initial cleanup)
-always-comb-blocking
-banned-declared-name-patterns
-constraint-name-style
-create-object-name-match
-dff-name-style
-disable-statement
-endif-comment
-explicit-begin
-forbidden-macro
-instance-shadowing
-invalid-system-task-function
-legacy-generate-region
-legacy-genvar-declaration
-macro-string-concatenation
-mismatched-labels
-numeric-format-string-style
-parameter-type-name-style
-plusarg-assignment
-port-name-suffix
-positive-meaning-parameter-name
-proper-parameter-declaration
-suspicious-semicolon
-uvm-macro-semicolon
-v2001-generate-begin